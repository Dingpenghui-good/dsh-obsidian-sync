# DSH Obsidian Sync Plugin Configuration

id: dsh-obsidian-sync
name: DSH Obsidian Sync
description: 自动同步 DSH 对话到 Obsidian 知识库

# 插件路径
path: src/

# 导出函数
exports:
  - searchKnowledgeBase
  - syncSession
  - extractKeywords
  - generateSummary
  - extractTags

# 注册 Tool（通过 DSH hooks 实现）
tools:
  - id: obsidian.read_knowledge
    handler: searchKnowledgeBase
    enabled: true
    
  - id: obsidian.sync_session
    handler: syncSession
    enabled: true
