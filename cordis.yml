# Cordis bundle patch for dsh-obsidian-sync.
#
# Static bundle patch: the row id must equal the package name
# (dsh-obsidian-sync). Loaded automatically via package.json's
# `dsh.bundle.patch` when the package is mounted as a profile bundle.
#
# 0.2.0-rc.1 settings note: the host settings framework keys each entry's
# form by the profile entry id (this `id`). The plugin's host-side code reads
# `settings.describe().find(row => row.ns === 'dsh-obsidian-sync')` to apply
# vaultPath / searchEnabled overrides; the `config` block below is merged into
# that same entry so the values reach the plugin through its Config schema.
#
# Mount options:
#   1) As a profile bundle (auto-load), or insert explicitly into the
#      profile's cordis.patch.yml:
#
#     - insert:
#         - id: dsh-obsidian-sync
#           name: 'dsh-obsidian-sync'
#           config:
#             vaultPath: 'E:/dsh-workspace/obsidian-vault'
#
#   2) Leave all config empty and fall back to the built-in defaults
#      (vaultPath defaults to E:/dsh-workspace/obsidian-vault).
#
# One patch replaces the whole config of the target row, so every key
# the row owns must be restated.

- id: dsh-obsidian-sync
  name: 'dsh-obsidian-sync'
  config:
    vaultPath: 'E:/dsh-workspace/obsidian-vault'
    searchEnabled: true
    indexRefreshMs: 60000
