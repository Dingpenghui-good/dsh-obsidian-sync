# Cordis bundle patch for dsh-obsidian-sync-v2.
#
# 挂载方式二选一：
#
# 1) 作为 profile bundle（package.json `dsh.bundle.patch` 自动加载），
#    或从 profile 的 cordis.patch.yml 显式插入：
#
#   - insert:
#       - id: obsidian-sync-v2
#         name: 'dsh-obsidian-sync-v2'
#         config:
#           vaultPath: 'E:/dsh-workspace/obsidian-vault'
#
# 2) 不改任何 config，全部走内置默认（vaultPath 缺省 E:/dsh-workspace/obsidian-vault）。
#
# 一个 patch 会整体替换目标行 config，所以该行拥有的每个键都要重写。

- id: obsidian-sync-v2
  name: 'dsh-obsidian-sync-v2'
  config:
    vaultPath: 'E:/dsh-workspace/obsidian-vault'
    searchEnabled: true
    indexRefreshMs: 60000
