# DSH Obsidian Sync — 参考配置（说明性，非加载入口）
#
# 0.2.0-rc.1：插件通过 `apply(ctx)` 命令式注册 4 个 Tool 与定时器，
# 声明式挂载由 `cordis.patch.yml`（`dsh.bundle.patch` 指向的 bundle patch）承担。
# 本文件仅作说明性索引，列出插件实际对外暴露的 4 个 Tool 与使用前提。
#
# 使用前提条件（在插件详情页设置，volatile HMR 即时生效）：
#   1. vaultPath —— 已存在的 Obsidian vault 目录（PARA 结构：
#      02-Projects / 03-Areas / 04-Archive / 05-Resources + DSH-会话归档-索引.md）
#   2. searchEnabled —— 是否启用倒排索引搜索
#   3. indexRefreshMs —— 索引增量重建间隔（≥5000ms）
#   4. git 自动推送（隐含）：vault 为 git 仓库且有 remote 时归档自动 commit + push
#
# 4 个 Tool（由 apply() 通过 ctx.tools.register(defineTool(...)) 动态注册）：
#   - obsidian_search       在 Obsidian 知识库中按关键词搜索相关笔记（倒排索引 + CJK bigram）
#   - obsidian_brief        每日简报：最相关提炼页 top3 + 最近归档 + 用户决策偏好
#   - obsidian_read_note    按相对路径读取 Obsidian 笔记的 frontmatter 与正文
#   - obsidian_sync_session 把当前 DSH 会话幂等归档到 vault/04-Archive/ 并自动挂索引
